name: eliminandomarcas-engine

services:
  eliminandomarcas-engine:
    build:
      context: .
    image: eliminandomarcas-engine:latest
    init: true
    restart: always
    env_file:
      - .env
    environment:
      NODE_ENV: production
    command: node src/index.js
    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - ./assets/audio:/app/assets/audio:ro

name: eliminandomarcas-engine

services:
  eliminandomarcas-engine:
    build:
      context: .
    image: eliminandomarcas-engine:latest
    init: true
    restart: always
    env_file:
      - .env
    environment:
      NODE_ENV: production
    command: node src/index.js
    volumes:
      - season-data:/app/data
      - rendered-videos:/app/output

  video-server:
    image: nginx:1.28-alpine
    init: true
    restart: always
    volumes:
      - rendered-videos:/usr/share/nginx/videos:ro
      - ./infra/nginx/prod.conf:/etc/nginx/nginx.conf:ro

volumes:
  season-data:
  rendered-videos:
